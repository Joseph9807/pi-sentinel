# specs/planning-context.yaml — written by elaborate-spec;
# consumed by scope-work and slice-tasks
feature_name: "pi-sentinel v1 — macOS safety guard for pi agent"
problem_statement: >-
  Current dangerous-ops extension only intercepts bash commands via
  hardcoded regexes and protects a fixed set of file paths. Every rule
  hit prompts the user, which is disruptive; there is no human-language
  explanation of what an operation does, no audit log of approved
  operations, and no automatic decision layer. The result: users either
  tolerate constant interruptions or switch to yolo mode and lose
  protection entirely. pi-sentinel v1 replaces dangerous-ops with a
  tiered decision system (rules -> LLM judge -> user) that balances
  safety and developer flow.
constraints:
  - >-
    Independent implementation: must not depend on pi-permission-system
    (it will be removed after pi-sentinel v1 ships)
  - >-
    LLM judge reuses the user's existing pi provider/API key via
    ctx.modelRegistry.getProviderAuth(); config may override the judge
    model
  - >-
    LLM judge calls are session-cached by command hash; 5s timeout or
    failure degrades to asking the user (fail-closed, never silently
    allow)
  - >-
    Non-interactive modes (print/json) block by default on dangerous
    operations
  - >-
    Audit log is JSONL, max 1MB per file, keep 5 rotated files, includes
    user choice
  - >-
    User approvals: three choices — allow / deny / deny with
    natural-language instruction handed back to the LLM for replanning
  - >-
    Approval dialog must show a short human-language English explanation
    of what the operation does
out_of_scope:
  - "Tool-level gating for all tools (v1.1+)"
  - "CWD external_directory boundary (v1.1+)"
  - "MCP / skill gating (v1.1+)"
  - "Subagent approval forwarding (v1.1+)"
key_decisions:
  - decision: >-
      Three-tier decision funnel: deterministic rules -> LLM judge ->
      user
    rationale: >-
      Rule layer is instant and free; judge handles ambiguous cases;
      only very dangerous operations reach the user. Balances yolo-mode
      convenience with safety.
  - decision: "AI-approved operations are silent, logged only"
    rationale: >-
      Users abandon approval systems that interrupt; logging keeps an
      audit trail without friction.
  - decision: >-
      Severity levels become block (user approval) / review (LLM judge)
      / safe (no intercept)
    rationale: >-
      Replaces old warn/block two-tier semantics.
  - decision: >-
      pi-sentinel v1 scope: upgraded bash rules across 5 macOS surfaces
      + sensitive path cross-cutting + three-choice approval + LLM judge
      + audit log
    rationale: >-
      Incremental versioning; permission-surface gating (tools/external
      dir/MCP/skill/subagents) lands in v1.1+.
  - decision: >-
      pi-sentinel v1 replaces both dangerous-ops and pi-permission-system
      on the user's machine
    rationale: "One approval system, no double prompts."
  - decision: >-
      Audit log records decision layer, disposition, matched rule, and
      user choice
    rationale: >-
      User choices are the highest-value audit data — reveals
      over-blocking rules.
